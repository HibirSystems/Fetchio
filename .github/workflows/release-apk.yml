name: Build Android Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Android version name (for example, 1.0.0)'
        required: true
        default: '1.0.0'
        type: string
      api_base_url:
        description: 'HTTPS backend URL ending in /api/v1 (or use PRODUCTION_API_URL secret)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Signed, size-optimized Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      API_BASE_URL: ${{ inputs.api_base_url || secrets.PRODUCTION_API_URL }}

    steps:
      - name: Checkout selected branch or tag
        uses: actions/checkout@v4

      - name: Validate release configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          for name in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required repository secret: {name}')
          if not re.fullmatch(r'\d+\.\d+\.\d+', os.environ['RELEASE_VERSION']):
              raise SystemExit('Version must be numeric major.minor.patch, such as 1.0.0')
          raw = os.environ['API_BASE_URL']
          url = urlsplit(raw)
          if (url.scheme != 'https' or not url.hostname or url.username or url.password
                  or url.query or url.fragment or any(c.isspace() for c in raw)
                  or url.path.rstrip('/') != '/api/v1'):
              raise SystemExit('Set api_base_url or PRODUCTION_API_URL to an HTTPS backend URL ending in /api/v1')
          try:
              url.port
          except ValueError:
              raise SystemExit('Invalid backend URL port')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          def escape(value):
              return (value.replace('\\', '\\\\').replace('\n', '\\n')
                      .replace('\r', '\\r').replace('\t', '\\t')
                      .replace(' ', '\\ ').replace('=', '\\=').replace(':', '\\:'))

          key = Path('frontend/android/app/release.jks')
          key.write_bytes(base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True))
          key.chmod(0o600)
          properties = Path('frontend/android/key.properties')
          properties.write_text('\n'.join([
              'storeFile=release.jks',
              'storePassword=' + escape(os.environ['STORE_PASSWORD']),
              'keyPassword=' + escape(os.environ['KEY_PASSWORD']),
              'keyAlias=' + escape(os.environ['KEY_ALIAS']),
          ]) + '\n', encoding='utf-8')
          properties.chmod(0o600)
          PY

      - name: Build Android release APKs only
        working-directory: frontend
        run: |
          flutter build apk --release \
            --split-per-abi \
            --tree-shake-icons \
            --split-debug-info=build/symbols \
            --build-name="$RELEASE_VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Verify signed release APKs and report sizes
        run: |
          set -euo pipefail
          mkdir -p dist/apks
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          printf '## Android release APK sizes\n\n| Architecture | Size (MiB) |\n|---|---:|\n' >> "$GITHUB_STEP_SUMMARY"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="frontend/build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$apk"
            "$APKSIGNER" verify "$apk"
            # This app uses the backend; native downloader executables add size without being used.
            if unzip -Z1 "$apk" | grep -E 'libfetchio_(ytdlp|ffmpeg)\.so$'; then
              echo 'Unexpected bundled downloader binary in backend-based release' >&2
              exit 1
            fi
            dest="dist/apks/fetchio-${RELEASE_VERSION}-${abi}.apk"
            cp "$apk" "$dest"
            size="$(stat -c %s "$dest")"
            awk -v abi="$abi" -v bytes="$size" 'BEGIN { printf "| %s | %.2f |\n", abi, bytes/1048576 }' >> "$GITHUB_STEP_SUMMARY"
          done
          (cd dist/apks && sha256sum *.apk > SHA256SUMS.txt)
          printf '\nDownload the APK matching your device, not all three. Most current phones use **arm64-v8a**.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: fetchio-${{ inputs.version }}-android-release-${{ github.run_number }}
          path: dist/apks/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain Dart symbols and R8 mapping separately
        uses: actions/upload-artifact@v4
        with:
          name: fetchio-${{ inputs.version }}-android-symbols-${{ github.run_number }}
          path: |
            frontend/build/symbols/
            frontend/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing files
        if: always()
        run: rm -f frontend/android/app/release.jks frontend/android/key.properties
